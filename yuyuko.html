<title> Saigyou Ayakashi - Sakura Falling </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #000000 url('https://images.steamusercontent.com/ugc/12847163751142599756/90F27F9D0C61356C179B57A60D0404B3A892C588/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true') no-repeat center center fixed; 
    background-size: cover; 
  }
  
  .character-name {
    position: absolute;
    top: 30px;   
    left: 40px;  
    font-family: 'Great Vibes', cursive; 
    font-size: 65px;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 192, 203, 0.8), 0 0 20px rgba(255, 182, 193, 0.5), 2px 2px 4px #000;
    z-index: 10;
    pointer-events: none;
    letter-spacing: 2px;
  }
</style>
<canvas id="canvas"></canvas>

<div class="character-name">Yuyuko Saigyouji</div>

<script>
  var canvas = document.getElementById('canvas');
  var context = canvas.getContext('2d');
  var W = window.innerWidth;
  var H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  
  var hearts = [];
  var num_hearts = 120; 

  function Heart(x, y) {
    this.x = x;
    this.y = y;
    this.s = Math.random() * 0.5 + 0.3; 
    this.speed = Math.random() * 1.5 + 0.8; 
    this.opacity = Math.random() * 0.6 + 0.4; 
    
    this.angle = Math.random() * Math.PI * 2; 
    this.swingSpeed = Math.random() * 0.02 + 0.01; 
    this.swingRange = Math.random() * 1.2 + 0.5;    
    this.rotation = Math.random() * Math.PI;       

    this.draw = function() {
      context.save();
      context.translate(this.x, this.y);
      context.rotate(this.rotation + Math.sin(this.angle) * 0.3); 
      context.scale(this.s, this.s);
      context.beginPath();
      context.moveTo(0, 0);
      
      context.bezierCurveTo(5, -5, 10, -10, 0, -20);
      context.bezierCurveTo(-10, -10, -5, -5, 0, 0);
      
      context.fillStyle = 'rgba(255, 192, 203, ' + this.opacity + ')'; 
      context.shadowBlur = 4;
      context.shadowColor = "pink";
      context.fill();
      context.restore();
    };

    this.update = function() {
      this.y += this.speed; 
      this.angle += this.swingSpeed; 
      this.x += Math.sin(this.angle) * this.swingRange; 

      if (this.y > H - 100) {
        this.opacity -= 0.005;
      }

      if (this.y > H || this.opacity <= 0 || this.x < -20 || this.x > W + 20) {
        this.x = Math.random() * W;
        this.y = -20;
        this.opacity = Math.random() * 0.6 + 0.4;
        this.speed = Math.random() * 1.5 + 0.8;
      }
    };
  }

  for (var i = 0; i < num_hearts; i++) {
    hearts.push(new Heart(Math.random() * W, Math.random() * H));
  }

  function animate() {
    requestAnimationFrame(animate);
    context.clearRect(0, 0, W, H);
    for (var i = 0; i < num_hearts; i++) {
      hearts[i].draw();
      hearts[i].update();
    }
  }
  
  window.addEventListener('resize', function() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  });

  animate();
</script>
